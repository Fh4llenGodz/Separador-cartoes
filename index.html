<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Separador Universal Premium</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

        :root {
            --bg-color: #050508;
            --card-bg: rgba(22, 26, 34, 0.7);
            --input-bg: #0d0f14;
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --primary-glow: rgba(139, 92, 246, 0.4);
            --success: #10b981;
            --success-hover: #059669;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(139, 92, 246, 0.5);
            
            --font-main: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.05), transparent 25%);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            z-index: 1;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 12px 48px 0 rgba(0, 0, 0, 0.4);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .card-header svg {
            width: 18px;
            height: 18px;
            fill: var(--primary);
            filter: drop-shadow(0 0 5px var(--primary-glow));
        }

        textarea {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            padding: 16px;
            font-size: 14px;
            font-family: var(--font-mono);
            line-height: 1.6;
            resize: vertical;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
            letter-spacing: -0.2px;
        }

        textarea:focus {
            border-color: var(--border-focus);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2), 0 0 0 3px var(--primary-glow);
        }

        #inputText {
            height: 130px;
        }

        #outputText {
            height: 180px;
            background-color: #090a0f;
            border-color: rgba(16, 185, 129, 0.2);
            color: #34d399;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4), 0 0 10px rgba(16, 185, 129, 0.05);
        }

        #repeatedText {
            height: 100px;
            background-color: #0d0a05;
            border-color: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4), 0 0 10px rgba(245, 158, 11, 0.05);
            margin-bottom: 15px;
        }

        .btn-group {
            display: flex;
            gap: 14px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            font-family: var(--font-main);
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--primary-glow);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), var(--success-hover));
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .result-box {
            background-color: rgba(13, 15, 20, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .result-box:hover {
            border-color: rgba(255,255,255,0.15);
            background-color: rgba(13, 15, 20, 1);
        }

        .result-box span:first-child {
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .result-box span:last-child {
            font-size: 20px;
            font-weight: 700;
            font-family: var(--font-main);
        }

        .val-green { color: var(--success); text-shadow: 0 0 10px rgba(16, 185, 129, 0.3); }
        .val-red { color: var(--danger); text-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }
        .val-blue { color: #60a5fa; text-shadow: 0 0 10px rgba(96, 165, 250, 0.3); }
        .val-orange { color: var(--warning); text-shadow: 0 0 10px rgba(245, 158, 11, 0.3); }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="card-header">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4-3h2v13h-2z"/></svg>
            COLE A LISTA
        </div>
        <textarea id="inputText" placeholder="Cole aqui os textos com os dados do cartão..."></textarea>
        <div class="btn-group">
            <button class="btn-primary" onclick="separar()">
                <svg class="btn-icon" viewBox="0 0 24 24"><path d="M14.4 6L14 4H5v17h2v-7h5.6l.4 2h7V6z"/></svg>
                SEPARAR
            </button>
            <button class="btn-secondary" onclick="limpar()">
                <svg class="btn-icon" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                LIMPAR
            </button>
        </div>
    </div>

    <div class="card" id="resultCard">
        <div class="card-header">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 9h-2V7h-2v5H6v2h2v5h2v-5h2v5h2v-5h2v-2h-2v-5h-2v5z"/></svg>
            RESULTADO
        </div>

        <div class="results-grid">
            <div class="result-box">
                <span>📄 Linhas</span>
                <span id="countLines" class="val-blue">0</span>
            </div>
            <div class="result-box">
                <span>✅ Válidos</span>
                <span id="countValid" class="val-green">0</span>
            </div>
            <div class="result-box">
                <span>⚠️ Inválidos</span>
                <span id="countInvalid" class="val-red">0</span>
            </div>
            <!-- Caixa de Únicos REMOVIDA -->
            <div class="result-box" style="grid-column: span 3;">
                <span>🔁 Cartões Repetidos</span>
                <span id="countRepeated" class="val-orange">0</span>
            </div>
        </div>

        <textarea id="outputText" readonly placeholder="Os cartões separados aparecerão aqui após clicar em SEPARAR..."></textarea>
        
        <textarea id="repeatedText" readonly placeholder="Os cartões repetidos aparecerão aqui..."></textarea>

        <div class="btn-group">
            <button class="btn-success" onclick="copiar(this)">
                <svg class="btn-icon" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                COPIAR
            </button>
            <button class="btn-secondary" onclick="baixarTxt()">
                <svg class="btn-icon" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                BAIXAR .TXT
            </button>
        </div>
    </div>
</div>

<script>
    function separar() {
        const input = document.getElementById('inputText').value;
        const outputTextarea = document.getElementById('outputText');
        const repeatedTextarea = document.getElementById('repeatedText');
        
        if (!input.trim()) {
            alert("Por favor, cole algum texto para separar.");
            return;
        }

        const lines = input.split('\n').filter(line => line.trim() !== '');
        let validCards = [];
        let invalidCount = 0;

        lines.forEach(line => {
            const match = line.match(/(\d{16})[^\d]*(\d{2})[^\d]*(\d{4})[^\d]*(\d{3,4})/);
            
            if (match) {
                const card = `${match[1]}|${match[2]}|${match[3]}|${match[4]}`;
                validCards.push(card);
            } else {
                invalidCount++;
            }
        });

        const cardCounts = {};
        validCards.forEach(card => {
            cardCounts[card] = (cardCounts[card] || 0) + 1;
        });

        const uniqueCards = [];
        const repeatedCards = [];
        let repeatedCount = 0;

        for (const [card, count] of Object.entries(cardCounts)) {
            if (count > 1) {
                repeatedCount += (count - 1);
                repeatedCards.push(`${card} (apareceu ${count} vezes)`);
            }
            uniqueCards.push(card);
        }

        document.getElementById('countLines').innerText = lines.length;
        document.getElementById('countValid').innerText = validCards.length;
        document.getElementById('countInvalid').innerText = invalidCount;
        document.getElementById('countRepeated').innerText = repeatedCount;

        if (uniqueCards.length > 0) {
            outputTextarea.value = uniqueCards.join('\n');
        } else {
            outputTextarea.value = "Nenhum cartão válido encontrado.";
        }

        if (repeatedCards.length > 0) {
            repeatedTextarea.value = repeatedCards.join('\n');
        } else {
            repeatedTextarea.value = "Nenhum cartão repetido.";
        }
    }

    function limpar() {
        document.getElementById('inputText').value = '';
        document.getElementById('outputText').value = '';
        document.getElementById('repeatedText').value = '';
        
        document.getElementById('countLines').innerText = '0';
        document.getElementById('countValid').innerText = '0';
        document.getElementById('countInvalid').innerText = '0';
        document.getElementById('countRepeated').innerText = '0';
    }

    function copiar(btnElement) {
        const outputTextarea = document.getElementById('outputText');
        const textToCopy = outputTextarea.value;
        
        if (!textToCopy || textToCopy === "Nenhum cartão válido encontrado.") {
            alert("Não há nada para copiar.");
            return;
        }

        navigator.clipboard.writeText(textToCopy).then(() => {
            const originalText = btnElement.innerHTML;
            btnElement.innerHTML = '✅ COPIADO!';
            setTimeout(() => {
                btnElement.innerHTML = originalText;
            }, 2000);
        }).catch(err => {
            alert("Erro ao copiar: " + err);
        });
    }

    function baixarTxt() {
        const outputTextarea = document.getElementById('outputText');
        const textToDownload = outputTextarea.value;

        if (!textToDownload || textToDownload === "Nenhum cartão válido encontrado.") {
            alert("Não há nada para baixar.");
            return;
        }

        const blob = new Blob([textToDownload], { type: 'text/plain' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'cartoes_separados.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
    }
</script>

</body>
