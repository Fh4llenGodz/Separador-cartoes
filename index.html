<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fh4llen Godz - Separador de Cartões</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

        :root {
            /* FUNDO DO APP - Preto profundo */
            --bg-color: #050508;
            --bg-gradient-1: rgba(139, 92, 246, 0.15);
            --bg-gradient-2: rgba(16, 185, 129, 0.08);
            
            /* CARDS - Cinza mais claro para destacar bem do fundo */
            --card-bg: #1a1f2e;
            --card-border: rgba(255, 255, 255, 0.1);
            
            /* TEXTAREAS - Cinza mais escuro que o card */
            --input-bg: #0d1017;
            --input-border: rgba(255, 255, 255, 0.12);
            
            /* OUTRAS CORES */
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --primary-glow: rgba(139, 92, 246, 0.5);
            --success: #10b981;
            --success-hover: #059669;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            --font-main: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --font-serif: 'Playfair Display', serif;
            
            --purple-light: #c4b5fd;
            --purple-soft: #a78bfa;
            --white-pure: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, var(--bg-gradient-1), transparent 30%),
                radial-gradient(circle at 90% 80%, var(--bg-gradient-2), transparent 30%);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 0;
            padding-top: 70px;
            padding-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 60px;
            background: rgba(5, 5, 8, 0.9);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 0 20px;
        }

        .app-header h1 {
            font-family: var(--font-serif);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .app-header h1 .purple-name {
            background: linear-gradient(135deg, var(--purple-light), var(--white-pure));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(167, 139, 250, 0.4);
            font-weight: 800;
            letter-spacing: 1px;
        }

        .app-header h1 .separator-text {
            color: var(--text-muted);
            font-family: var(--font-main);
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 1;
            padding: 20px;
            margin-top: 10px;
        }

        /* CARDS - Cinza mais claro e visível */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid var(--card-border);
            box-shadow: 
                0 15px 40px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                inset 0 -1px 0 rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .card-header-title svg {
            width: 16px;
            height: 16px;
            fill: var(--primary);
            filter: drop-shadow(0 0 5px var(--primary-glow));
        }

        /* TEXTAREAS - Cinza mais escuro que o card */
        textarea {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            color: var(--text-main);
            padding: 16px;
            font-size: 14px;
            font-family: var(--font-mono);
            line-height: 1.6;
            resize: vertical;
            outline: none;
            letter-spacing: -0.2px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            
            box-shadow: 
                inset 0 6px 12px rgba(0, 0, 0, 0.7),
                inset 0 -2px 4px rgba(255, 255, 255, 0.03),
                0 1px 0 rgba(255, 255, 255, 0.05);
        }

        textarea:focus {
            border-color: rgba(139, 92, 246, 0.5);
            box-shadow: 
                inset 0 6px 12px rgba(0, 0, 0, 0.7),
                inset 0 -2px 4px rgba(255, 255, 255, 0.03),
                0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        textarea::-webkit-scrollbar {
            width: 6px;
        }
        textarea::-webkit-scrollbar-track {
            background: transparent;
        }
        textarea::-webkit-scrollbar-thumb {
            background: var(--input-border);
            border-radius: 3px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        #inputText {
            height: 130px;
        }

        #outputText {
            height: 150px;
            margin-bottom: 12px;
        }

        #repeatedText {
            height: 100px;
            margin-bottom: 0;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            font-family: var(--font-main);
            letter-spacing: 0.5px;
            transition: all 0.1s ease;
            
            box-shadow: 
                0 4px 6px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                inset 0 -2px 0 rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 
                0 1px 2px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                inset 0 -1px 0 rgba(0, 0, 0, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #2a2e3d, #1f232d);
            color: var(--text-main);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), var(--success-hover));
            color: white;
        }

        .btn-icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        /* RESULT-BOX - Fundo mais escuro que o card */
        .result-box {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 12px;
            box-shadow: 
                inset 0 3px 6px rgba(0,0,0,0.5),
                inset 0 -1px 0 rgba(255,255,255,0.03);
        }

        .result-box span:first-child {
            color: var(--text-muted);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            text-align: center;
        }

        .result-box span:last-child {
            font-size: 22px;
            font-weight: 700;
        }

        .val-green { color: var(--success); text-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .val-red { color: var(--danger); text-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
        .val-blue { color: #60a5fa; text-shadow: 0 0 15px rgba(96, 165, 250, 0.4); }
        .val-orange { color: var(--warning); text-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 12px 24px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            opacity: 0;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 999;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast svg {
            width: 18px;
            height: 18px;
            fill: var(--success);
        }
    </style>
</head>
<body>

<header class="app-header">
    <h1>
        <span class="purple-name">Fh4llen Godz</span> 
        <span class="separator-text"> - Separador de Cartões</span>
    </h1>
</header>

<div class="container">
    <div class="card">
        <div class="card-header">
            <div class="card-header-title">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4-3h2v13h-2z"/></svg>
                COLE A LISTA
            </div>
        </div>
        <textarea id="inputText" placeholder="Cole aqui os textos com os dados do cartão..."></textarea>
        <div class="btn-group">
            <button class="btn-primary" onclick="separar()">
                <svg class="btn-icon" viewBox="0 0 24 24"><path d="M14.4 6L14 4H5v17h2v-7h5.6l.4 2h7V6z"/></svg>
                SEPARAR
            </button>
            <button class="btn-secondary" onclick="limpar()">
                <svg class="btn-icon" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                LIMPAR
            </button>
        </div>
    </div>

    <div class="card" id="resultCard">
        <div class="card-header">
            <div class="card-header-title">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 9h-2V7h-2v5H6v2h2v5h2v-5h2v5h2v-5h2v-2h-2v-5h-2v5z"/></svg>
                RESULTADO
            </div>
        </div>

        <div class="results-grid">
            <div class="result-box">
                <span>📄 Linhas</span>
                <span id="countLines" class="val-blue">0</span>
            </div>
            <div class="result-box">
                <span>✅ Válidos</span>
                <span id="countValid" class="val-green">0</span>
            </div>
            <div class="result-box">
                <span>⚠️ Inválidos</span>
                <span id="countInvalid" class="val-red">0</span>
            </div>
            <div class="result-box" style="grid-column: span 3;">
                <span>🔁 Cartões Repetidos</span>
                <span id="countRepeated" class="val-orange">0</span>
            </div>
        </div>

        <textarea id="outputText" readonly placeholder="Os cartões separados aparecerão aqui após clicar em SEPARAR..."></textarea>
        
        <textarea id="repeatedText" readonly placeholder="Os cartões repetidos aparecerão aqui..."></textarea>

        <div class="btn-group">
            <button class="btn-success" onclick="copiar(this)">
                <svg class="btn-icon" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                COPIAR
            </button>
            <button class="btn-secondary" onclick="baixarTxt()">
                <svg class="btn-icon" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                BAIXAR .TXT
            </button>
        </div>
    </div>
</div>

<div class="toast" id="toast">
    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
    <span id="toastMessage">Copiado com sucesso!</span>
</div>

<script>
    function showToast(message) {
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        
        if (toast.classList.contains('show')) {
            toastMessage.innerText = message;
            return;
        }
        
        toastMessage.innerText = message;
        toast.classList.add('show');
        
        setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }

    function separar() {
        const input = document.getElementById('inputText').value;
        const outputTextarea = document.getElementById('outputText');
        const repeatedTextarea = document.getElementById('repeatedText');
        
        if (!input.trim()) {
            showToast("Cole algum texto para separar.");
            return;
        }

        const lines = input.split('\n').filter(line => line.trim() !== '');
        let validCards = [];
        let invalidCount = 0;

        lines.forEach(line => {
            const match = line.match(/(\d{16})[^\d]*(\d{2})[^\d]*(\d{4})[^\d]*(\d{3,4})/);
            
            if (match) {
                const card = `${match[1]}|${match[2]}|${match[3]}|${match[4]}`;
                validCards.push(card);
            } else {
                invalidCount++;
            }
        });

        const cardCounts = {};
        validCards.forEach(card => {
            cardCounts[card] = (cardCounts[card] || 0) + 1;
        });

        const uniqueCards = [];
        const repeatedCards = [];
        let repeatedCount = 0;

        for (const [card, count] of Object.entries(cardCounts)) {
            if (count > 1) {
                repeatedCount += (count - 1);
                repeatedCards.push(`${card} (apareceu ${count} vezes)`);
            }
            uniqueCards.push(card);
        }

        document.getElementById('countLines').innerText = lines.length;
        document.getElementById('countValid').innerText = validCards.length;
        document.getElementById('countInvalid').innerText = invalidCount;
        document.getElementById('countRepeated').innerText = repeatedCount;

        if (uniqueCards.length > 0) {
            outputTextarea.value = uniqueCards.join('\n');
        } else {
            outputTextarea.value = "Nenhum cartão válido encontrado.";
        }

        if (repeatedCards.length > 0) {
            repeatedTextarea.value = repeatedCards.join('\n');
        } else {
            repeatedTextarea.value = "Nenhum cartão repetido.";
        }
        
        showToast("Separação concluída!");
    }

    function limpar() {
        document.getElementById('inputText').value = '';
        document.getElementById('outputText').value = '';
        document.getElementById('repeatedText').value = '';
        
        document.getElementById('countLines').innerText = '0';
        document.getElementById('countValid').innerText = '0';
        document.getElementById('countInvalid').innerText = '0';
        document.getElementById('countRepeated').innerText = '0';
        
        showToast("Tudo limpo!");
    }

    function copiar(btnElement) {
        const outputTextarea = document.getElementById('outputText');
        const textToCopy = outputTextarea.value;
        
        if (!textToCopy || textToCopy === "Nenhum cartão válido encontrado.") {
            showToast("Não há nada para copiar.");
            return;
        }

        navigator.clipboard.writeText(textToCopy).then(() => {
            const originalText = btnElement.innerHTML;
            btnElement.innerHTML = '✅ COPIADO!';
            setTimeout(() => {
                btnElement.innerHTML = originalText;
            }, 2000);
            showToast("Cartões copiados!");
        }).catch(err => {
            showToast("Erro ao copiar.");
        });
    }

    function baixarTxt() {
        const outputTextarea = document.getElementById('outputText');
        const textToDownload = outputTextarea.value;

        if (!textToDownload || textToDownload === "Nenhum cartão válido encontrado.") {
            showToast("Não há nada para baixar.");
            return;
        }

        try {
            const blob = new Blob([textToDownload], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'cartoes_separados.txt';
            a.style.display = 'none';
            
            document.body.appendChild(a);
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 2000);
            
            showToast("Download iniciado!");
        } catch (err) {
            try {
                const dataUri = 'data:text/plain;charset=utf-8,' + encodeURIComponent(textToDownload);
                const a = document.createElement('a');
                a.href = dataUri;
                a.download = 'cartoes_separados.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showToast("Download via fallback iniciado!");
            } catch (e) {
                showToast("Erro: seu navegador bloqueou o download.");
            }
        }
    }
</script>

</body>
</html>
